<!DOCTYPE html>
<html class="dark" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>FlashMeet - Random Video Chat</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "primary": "#ffc688",
                        "primary-container": "#ff9f0a",
                        "on-primary-container": "#673d00",
                        "background": "#1a120a",
                        "on-surface": "#f1e0d1",
                        "on-surface-variant": "#dac3ad",
                        "surface-variant": "#3d3329",
                        "outline": "#a28d79",
                    },
                    "fontFamily": {
                        "body-lg": ["Space Grotesk"],
                        "display-lg": ["Space Grotesk"],
                    }
                },
            },
        }
    </script>
    <style>
        .glass-bronze {
            background: rgba(45, 34, 27, 0.6);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 159, 10, 0.2);
        }
        .bloom-primary {
            box-shadow: 0 0 20px rgba(255, 159, 10, 0.4);
        }
        .bloom-text {
            text-shadow: 0 0 10px rgba(255, 159, 10, 0.5);
        }
        body {
            background: radial-gradient(circle at top right, #382f25 0%, #1a120a 60%);
            min-height: 100vh;
        }
        #localVideo {
            transform: scaleX(-1);
        }
        .video-container {
            position: relative;
            width: 100%;
            height: 100%;
            background: #000;
            border-radius: 0.75rem;
            overflow: hidden;
        }
        .video-label {
            position: absolute;
            bottom: 12px;
            left: 12px;
            background: rgba(0, 0, 0, 0.6);
            color: #ffc688;
            padding: 4px 12px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            z-index: 10;
        }
        #chatMessages::-webkit-scrollbar {
            width: 4px;
        }
        #chatMessages::-webkit-scrollbar-thumb {
            background: rgba(255, 159, 10, 0.2);
            border-radius: 10px;
        }
    </style>
</head>
<body class="bg-background text-on-surface font-body-lg flex flex-col">

<!-- TopNavBar -->
<nav class="fixed top-0 w-full z-50 border-b border-amber-900/30 bg-neutral-950/60 backdrop-blur-xl shadow-[0_8px_32px_0_rgba(0,0,0,0.8)]">
    <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center w-full">
        <div class="flex items-center gap-8">
            <span class="text-2xl font-black tracking-tighter bg-gradient-to-br from-amber-400 to-orange-600 bg-clip-text text-transparent font-['Space_Grotesk']">FlashMeet</span>
            <div class="hidden md:flex items-center gap-6">
                <span id="statusText" class="text-sm font-medium text-amber-500/80 tracking-tight">Click Start to begin</span>
            </div>
        </div>
        <div class="flex items-center gap-4">
            <button id="startBtn" onclick="start()" class="bg-primary-container text-on-primary-container px-6 py-2 rounded-full font-medium tracking-tight bloom-primary hover:scale-105 active:scale-95 transition-all">Start</button>
            <button id="nextBtn" onclick="next()" disabled class="hidden opacity-50 bg-surface-variant text-on-surface px-6 py-2 rounded-full font-medium tracking-tight border border-primary/20 hover:border-primary/50 transition-all disabled:cursor-not-allowed">Next</button>
            <button id="stopBtn" onclick="stop()" disabled class="hidden opacity-50 bg-red-900/40 text-red-200 px-6 py-2 rounded-full font-medium tracking-tight border border-red-500/20 hover:bg-red-500/20 transition-all">Stop</button>
        </div>
    </div>
</nav>

<main class="flex-grow pt-24 pb-8 px-6 flex flex-col items-center justify-center max-w-7xl mx-auto w-full">
    
    <!-- Hero Section (Visible before start) -->
    <section id="heroSection" class="text-center space-y-8 max-w-4xl py-12">
        <span class="inline-block font-bold text-xs text-primary border border-primary/30 px-4 py-2 rounded-full glass-bronze uppercase tracking-widest">Random Video Chat</span>
        <h1 class="text-5xl md:text-7xl font-bold text-on-surface bloom-text">Real Talk. <span class="text-primary">Right Now.</span></h1>
        <p class="text-lg text-on-surface-variant max-w-2xl mx-auto">
            Meet strangers instantly with high-fidelity video and audio. No sign-up, no downloads — just click Start and talk.
        </p>
        <div class="pt-4">
            <button onclick="start()" class="bg-gradient-to-r from-amber-500 to-orange-600 text-on-primary-container px-12 py-5 rounded-full font-bold text-xl bloom-primary hover:scale-105 transition-transform active:scale-95">
                Start Connecting
            </button>
        </div>
    </section>

    <!-- Video & Chat Section (Hidden before start) -->
    <section id="chatSection" class="hidden w-full h-full flex-grow flex flex-col md:flex-row gap-6 min-h-0">
        <!-- Video Grid -->
        <div class="flex-grow grid grid-cols-1 md:grid-cols-2 gap-4 min-h-0">
            <div class="video-container border border-primary/20 shadow-2xl">
                <video id="localVideo" class="w-full h-full object-cover" autoplay muted playsinline></video>
                <div class="video-label">You</div>
            </div>
            <div class="video-container border border-primary/20 shadow-2xl">
                <video id="remoteVideo" class="w-full h-full object-cover" autoplay playsinline></video>
                <div class="video-label">Stranger</div>
            </div>
        </div>

        <!-- Chat Panel -->
        <div class="w-full md:w-80 flex flex-col glass-bronze rounded-xl border border-primary/20 overflow-hidden shadow-2xl">
            <div class="p-4 border-b border-primary/10 flex items-center justify-between bg-black/20">
                <h3 class="font-bold text-sm text-primary uppercase tracking-widest">Live Chat</h3>
                <span class="w-2 h-2 rounded-full bg-primary animate-pulse"></span>
            </div>
            <div id="chatMessages" class="flex-grow p-4 overflow-y-auto space-y-4 text-sm scroll-smooth">
                <div class="text-center text-on-surface-variant/40 italic py-4">Find someone to start chatting</div>
            </div>
            <div class="p-4 bg-black/40 border-t border-primary/10">
                <div class="flex gap-2">
                    <input id="msgInput" type="text" placeholder="Type a message..." disabled
                           onkeydown="if (event.key === 'Enter') sendChat();"
                           class="flex-grow bg-surface-variant/50 border border-primary/10 rounded-lg px-4 py-2 text-on-surface placeholder:text-on-surface-variant/30 focus:outline-none focus:border-primary/40 transition-all"/>
                    <button id="sendBtn" onclick="sendChat()" disabled
                            class="bg-primary text-on-primary-container p-2 rounded-lg hover:brightness-110 active:scale-95 transition-all">
                        <span class="material-symbols-outlined">send</span>
                    </button>
                </div>
            </div>
        </div>
    </section>
</main>

<!-- Footer -->
<footer class="w-full border-t border-amber-900/40 bg-neutral-950 py-6">
    <div class="max-w-7xl mx-auto px-8 flex justify-between items-center text-xs text-on-surface-variant/40 font-medium tracking-tight">
        <span>© 2026 FLASHMEET</span>
        <div class="flex gap-6">
            <a href="#" class="hover:text-primary transition-colors">SAFETY</a>
            <a href="#" class="hover:text-primary transition-colors">PRIVACY</a>
            <a href="#" class="hover:text-primary transition-colors">TERMS</a>
        </div>
    </div>
</footer>

<script>
    const url = new URL(window.location.href);
    let ws = null;
    let localStream = null;
    let peerConnection = null;
    let isCaller = false;
    let sessionToken = null;

    const config = {
        iceServers: [
            { urls: "stun:stun.l.google.com:19302" },
            { urls: "stun:stun1.l.google.com:19302" },
            {
                urls: "turn:openrelay.metered.ca:80",
                username: "openrelayproject",
                credential: "openrelayproject",
            },
            {
                urls: "turn:openrelay.metered.ca:443",
                username: "openrelayproject",
                credential: "openrelayproject",
            },
        ],
        iceCandidatePoolSize: 10,
    };

    function setStatus(text, type) {
        const el = document.getElementById("statusText");
        el.textContent = text;
        if (type === 'active') el.className = "text-sm font-bold text-green-400 tracking-tight";
        else if (type === 'searching') el.className = "text-sm font-bold text-amber-400 animate-pulse tracking-tight";
        else el.className = "text-sm font-medium text-amber-500/80 tracking-tight";
    }

    async function start() {
        alert("Start clicked");
        document.getElementById("startBtn").disabled = true;

        try {
            setStatus("Requesting camera...");
            alert("Requesting camera...");
            // Use more specific constraints for mobile compatibility
            localStream = await navigator.mediaDevices.getUserMedia({
                video: {
                    facingMode: "user",
                    width: { ideal: 640 },
                    height: { ideal: 480 }
                },
                audio: true,
            });
            alert("Camera acquired");
            document.getElementById("localVideo").srcObject = localStream;
            
            // Show chat section, hide hero
            document.getElementById("heroSection").classList.add("hidden");
            document.getElementById("chatSection").classList.remove("hidden");
            document.getElementById("startBtn").classList.add("hidden");
            document.getElementById("nextBtn").classList.remove("hidden");
            document.getElementById("stopBtn").classList.remove("hidden");
        } catch (e) {
            alert("Camera error: " + e.name + " - " + e.message);
            console.error("Camera error:", e);
            setStatus("Camera access denied");
            document.getElementById("startBtn").disabled = false;
            return;
        }

        try {
            setStatus("Connecting...");
            const api = await fetch(`${url.origin}/session/new`);
            const response = await api.json();
            sessionToken = response.token;

            const protocol = url.protocol === "https:" ? "wss:" : "ws:";
            ws = new WebSocket(`${protocol}//${url.host}/ws?token=${sessionToken}`);

            ws.onopen = () => {
                setStatus("Looking for someone...", "searching");
                document.getElementById("stopBtn").disabled = false;
                document.getElementById("stopBtn").classList.remove("opacity-50");
                ws.send(JSON.stringify({ op: "join_queue" }));
            };

            ws.onmessage = (event) => {
                const msg = JSON.parse(event.data);
                handleMessage(msg);
            };

            ws.onclose = () => {
                setStatus("Disconnected");
                resetUI(false);
            };

            ws.onerror = () => {
                setStatus("Connection error");
            };
        } catch (e) {
            console.error("Connect error:", e);
            setStatus("Failed to connect");
            document.getElementById("startBtn").disabled = false;
        }
    }

    function next() {
        if (peerConnection) {
            peerConnection.close();
            peerConnection = null;
        }
        document.getElementById("remoteVideo").srcObject = null;
        isCaller = false;

        sendMessage({ op: "next" });

        document.getElementById("nextBtn").disabled = true;
        document.getElementById("msgInput").disabled = true;
        document.getElementById("sendBtn").disabled = true;
        clearChat();
        addSystemMsg("Looking for someone new...");
        setStatus("Looking for someone...", "searching");
    }

    function stop() {
        if (localStream) {
            localStream.getTracks().forEach((t) => t.stop());
            localStream = null;
        }
        if (peerConnection) {
            peerConnection.close();
            peerConnection = null;
        }
        if (ws) {
            ws.close();
            ws = null;
        }
        resetUI(true);
    }

    function resetUI(full) {
        document.getElementById("startBtn").disabled = false;
        document.getElementById("startBtn").classList.remove("hidden");
        document.getElementById("nextBtn").classList.add("hidden");
        document.getElementById("stopBtn").classList.add("hidden");
        
        document.getElementById("heroSection").classList.remove("hidden");
        document.getElementById("chatSection").classList.add("hidden");
        
        isCaller = false;

        if (full) {
            document.getElementById("localVideo").srcObject = null;
            document.getElementById("remoteVideo").srcObject = null;
            setStatus("Click Start to begin");
            clearChat();
        }
    }

    function handleMessage(msg) {
        switch (msg.op) {
            case "match_found":
                handleMatchFound(msg);
                break;
            case "webrtc_offer":
                handleOffer(msg);
                break;
            case "webrtc_answer":
                handleAnswer(msg);
                break;
            case "ice_candidate":
                handleIceCandidate(msg);
                break;
            case "chat":
                addMsg(msg.message, "received");
                break;
            case "partner_disconnected":
                handlePartnerDisconnected();
                break;
        }
    }

    async function handleMatchFound(msg) {
        isCaller = msg.role === "caller";
        setStatus("Matched with stranger", "active");
        clearChat();
        addSystemMsg("You're now chatting with a stranger.");

        document.getElementById("nextBtn").disabled = false;
        document.getElementById("nextBtn").classList.remove("opacity-50");
        document.getElementById("msgInput").disabled = false;
        document.getElementById("sendBtn").disabled = false;

        await createPeerConnection();

        if (isCaller) {
            const offer = await peerConnection.createOffer();
            await peerConnection.setLocalDescription(offer);
            sendMessage({
                op: "webrtc_offer",
                data: { sdp: offer.sdp },
            });
        }
    }

    async function createPeerConnection() {
        peerConnection = new RTCPeerConnection(config);

        if (localStream) {
            localStream.getTracks().forEach((track) => {
                peerConnection.addTrack(track, localStream);
            });
        }

        peerConnection.onicecandidate = (event) => {
            if (event.candidate) {
                sendMessage({
                    op: "ice_candidate",
                    data: { candidate: event.candidate },
                });
            }
        };

        peerConnection.ontrack = (event) => {
            const remoteVideo = document.getElementById("remoteVideo");
            if (remoteVideo.srcObject !== event.streams[0]) {
                remoteVideo.srcObject = event.streams[0];
            }
        };
    }

    async function handleOffer(msg) {
        if (isCaller) return;
        if (!peerConnection) await createPeerConnection();

        await peerConnection.setRemoteDescription(new RTCSessionDescription({ type: "offer", sdp: msg.data }));
        const answer = await peerConnection.createAnswer();
        await peerConnection.setLocalDescription(answer);

        sendMessage({ op: "webrtc_answer", data: { sdp: answer.sdp } });
    }

    async function handleAnswer(msg) {
        if (!isCaller || !peerConnection) return;
        await peerConnection.setRemoteDescription(new RTCSessionDescription({ type: "answer", sdp: msg.data.sdp }));
    }

    async function handleIceCandidate(msg) {
        if (peerConnection && msg.data.candidate) {
            const candidate = msg.data.candidate;
            await peerConnection.addIceCandidate(new RTCIceCandidate({
                candidate: candidate.candidate,
                sdpMLineIndex: candidate.sdpMLineIndex,
                sdpMid: candidate.sdpMid,
            }));
        }
    }

    function handlePartnerDisconnected() {
        if (peerConnection) {
            peerConnection.close();
            peerConnection = null;
        }
        document.getElementById("remoteVideo").srcObject = null;
        isCaller = false;
        document.getElementById("msgInput").disabled = true;
        document.getElementById("sendBtn").disabled = true;
        document.getElementById("nextBtn").disabled = true;

        addSystemMsg("Stranger has disconnected.");
        setStatus("Looking for someone...", "searching");

        setTimeout(() => {
            if (ws && ws.readyState === WebSocket.OPEN && localStream) {
                ws.send(JSON.stringify({ op: "join_queue" }));
            }
        }, 1500);
    }

    function sendMessage(message) {
        if (ws && ws.readyState === WebSocket.OPEN) {
            ws.send(JSON.stringify(message));
        }
    }

    function sendChat() {
        const input = document.getElementById("msgInput");
        const text = input.value.trim();
        if (!text || !ws || ws.readyState !== WebSocket.OPEN) return;

        sendMessage({ op: "chat", data: { message: text } });
        addMsg(text, "sent");
        input.value = "";
    }

    function addMsg(text, type) {
        const box = document.getElementById("chatMessages");
        const d = document.createElement("div");
        d.className = `max-w-[85%] rounded-2xl px-4 py-2 text-sm ${type === 'sent' ? 'bg-primary text-on-primary-container ml-auto rounded-tr-none' : 'bg-surface-variant text-on-surface mr-auto rounded-tl-none border border-primary/10'}`;
        d.textContent = text;
        box.appendChild(d);
        box.scrollTop = box.scrollHeight;
    }

    function addSystemMsg(text) {
        const box = document.getElementById("chatMessages");
        const d = document.createElement("div");
        d.className = "text-center text-[10px] uppercase tracking-widest text-on-surface-variant/40 py-2 font-bold";
        d.textContent = text;
        box.appendChild(d);
        box.scrollTop = box.scrollHeight;
    }

    function clearChat() {
        document.getElementById("chatMessages").innerHTML = "";
    }
</script>
</body>
</html>
